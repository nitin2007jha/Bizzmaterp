name: Build Android APK

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build variant"
        required: true
        default: "both"
        type: choice
        options:
          - debug
          - release
          - both
      build_aab:
        description: "Also build Play Store App Bundle (.aab)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-apk:
    name: Build My Business ERP APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure preinstalled Android SDK & accept licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" || true
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf "\n601085b94cd77f0b54ff86406957099ebe79c4d6" > "$SDK_DIR/licenses/android-googletv-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$SDK_DIR/licenses/google-gdk-license"

          SDKMANAGER=""
          for candidate in \
            "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
            "$(command -v sdkmanager || true)" \
            $(find "$SDK_DIR/cmdline-tools" -maxdepth 3 -name sdkmanager 2>/dev/null || true); do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36"
            "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platforms;android-36.1" || true
          else
            echo "::warning::sdkmanager not found under $SDK_DIR; using preinstalled SDK packages"
          fi
          echo "Installed platforms:" && ls -la "$SDK_DIR/platforms" || true
          echo "Installed build-tools:" && ls -la "$SDK_DIR/build-tools" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-disabled: true

      - name: Prepare signing keystores & optional secrets
        id: prep
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\n\r ' < debug.keystore.base64 | base64 -d > debug.keystore
              echo "Decoded debug.keystore from debug.keystore.base64"
            else
              keytool -genkey -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated fallback debug.keystore"
            fi
          fi

          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Wrote app/google-services.json from GOOGLE_SERVICES_JSON secret"
            elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r ' | base64 -d > app/google-services.json
              echo "Decoded app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret"
            else
              echo "::notice::app/google-services.json not found in repo or GOOGLE_SERVICES_JSON / GOOGLE_SERVICES_JSON_BASE64 secrets. APK will build and open cleanly, and adding the secret enables Firebase & Google Sign-In."
            fi
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "store_password=$STORE_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "key_password=$KEY_PASSWORD" >> "$GITHUB_OUTPUT"
            echo "signing_mode=production" >> "$GITHUB_OUTPUT"
            echo "Decoded production release keystore my-upload-key.jks"
          else
            CI_PASS="MyBizErpCI2026"
            keytool -genkey -v \
              -keystore my-upload-key.jks \
              -storepass "$CI_PASS" \
              -alias upload \
              -keypass "$CI_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=My Business ERP CI,O=MyBusinessERP,C=IN"
            echo "store_password=$CI_PASS" >> "$GITHUB_OUTPUT"
            echo "key_password=$CI_PASS" >> "$GITHUB_OUTPUT"
            echo "signing_mode=ci-ephemeral" >> "$GITHUB_OUTPUT"
            echo "::notice::Using CI fallback upload keystore for release build. Add RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD secrets for Play Store production signing."
          fi

          ls -la debug.keystore my-upload-key.jks app/google-services.json || true

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        run: |
          GRADLE_CMD="gradle"
          if [ -x ./gradlew ]; then GRADLE_CMD="./gradlew"; fi
          set +e
          "$GRADLE_CMD" assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            -Dkotlin.compiler.execution.strategy=daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee /tmp/gradle-debug.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== CONCISE FAILURE SUMMARY ==="
            grep -n -C 8 -E "(^> Task .* FAILED|^\* What went wrong:|Caused by:|Execution failed|Could not |FAILURE:)" /tmp/gradle-debug.log | head -n 80 || true
            exit "$EXIT_CODE"
          fi

      - name: Upload Debug APK artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: my-business-erp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both')) }}
        env:
          STORE_PASSWORD: ${{ steps.prep.outputs.store_password }}
          KEY_PASSWORD: ${{ steps.prep.outputs.key_password }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          GRADLE_CMD="gradle"
          if [ -x ./gradlew ]; then GRADLE_CMD="./gradlew"; fi
          set +e
          "$GRADLE_CMD" assembleRelease \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            -Dkotlin.compiler.execution.strategy=daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee /tmp/gradle-release.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== CONCISE FAILURE SUMMARY ==="
            grep -n -C 8 -E "(^> Task .* FAILED|^\* What went wrong:|Caused by:|Execution failed|Could not |FAILURE:)" /tmp/gradle-release.log | head -n 80 || true
            exit "$EXIT_CODE"
          fi

      - name: Upload Release APK artifact
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.build_type == 'release' || inputs.build_type == 'both')) }}
        uses: actions/upload-artifact@v4
        with:
          name: my-business-erp-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Release App Bundle (.aab)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_aab == true }}
        env:
          STORE_PASSWORD: ${{ steps.prep.outputs.store_password }}
          KEY_PASSWORD: ${{ steps.prep.outputs.key_password }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          GRADLE_CMD="gradle"
          if [ -x ./gradlew ]; then GRADLE_CMD="./gradlew"; fi
          set +e
          "$GRADLE_CMD" bundleRelease \
            --no-daemon \
            --no-configuration-cache \
            --no-build-cache \
            --no-parallel \
            --max-workers=2 \
            --console=plain \
            -Dkotlin.compiler.execution.strategy=daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            2>&1 | tee /tmp/gradle-bundle.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "=== CONCISE FAILURE SUMMARY ==="
            grep -n -C 8 -E "(^> Task .* FAILED|^\* What went wrong:|Caused by:|Execution failed|Could not |FAILURE:)" /tmp/gradle-bundle.log | head -n 80 || true
            exit "$EXIT_CODE"
          fi

      - name: Upload App Bundle (.aab) artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_aab == true }}
        uses: actions/upload-artifact@v4
        with:
          name: my-business-erp-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (on v* tags)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Write APK Build Summary
        if: ${{ always() }}
        run: |
          echo "### My Business ERP — APK Build Summary (${{ steps.prep.outputs.signing_mode }})" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f app/google-services.json ]; then
            echo "> ⚠️ **Warning:** \`app/google-services.json\` was not found during this build. Upload \`app/google-services.json\` to the repo (or paste its contents into the \`GOOGLE_SERVICES_JSON\` GitHub Actions secret) so Google Sign-In and Firebase Firestore work inside the APK." >> "$GITHUB_STEP_SUMMARY"
          fi
          for apk in app/build/outputs/apk/*/*.apk app/build/outputs/bundle/*/*.aab; do
            if [ -f "$apk" ]; then
              size=$(du -h "$apk" | cut -f1)
              sha=$(sha256sum "$apk" | cut -d' ' -f1)
              echo "- **$(basename "$apk")** ($size) — SHA-256: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
